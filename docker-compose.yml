version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: kombi_postgres
    environment:
      POSTGRES_USER: kombi_admin
      POSTGRES_PASSWORD: kombi_secure_password
      POSTGRES_DB: kombi_fleet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kombi_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
